[project]
name = "experiments"
version = "0.1.0"
description = "Sandbox, proof-of-concept projects, benchmarking, and hybrid ML experiments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ai-journey-shared",
    "jupyter>=1.1.0",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
]

[tool.uv.sources]
ai-journey-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = [
    "basedpyright>=1.27.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
