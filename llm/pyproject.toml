[project]
name = "llm-learning"
version = "0.1.0"
description = "Large Language Models: Tokenization, Transformer Scratch, Fine-tuning (LoRA/QLoRA), RAG, and Quantization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ai-journey-shared",
    "datasets>=3.2.0",
    "jupyter>=1.1.0",
    "numpy>=2.2.0",
    "peft>=0.14.0",
    "tiktoken>=0.8.0",
    "torch>=2.6.0",
    "transformers>=4.48.0",
]

[tool.uv.sources]
ai-journey-shared = { path = "../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_learning"]

[dependency-groups]
dev = [
    "basedpyright>=1.27.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
