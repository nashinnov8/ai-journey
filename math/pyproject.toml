[project]
name = "math-learning"
version = "0.1.0"
description = "Mathematical foundations of AI/ML: Linear Algebra, Calculus, Optimization, and Probability"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ai-journey-shared",
    "jupyter>=1.1.0",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "scipy>=1.15.0",
    "sympy>=1.13.0",
]

[tool.uv.sources]
ai-journey-shared = { path = "../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_learning"]

[dependency-groups]
dev = [
    "basedpyright>=1.27.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
