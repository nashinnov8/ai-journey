[project]
name = "mlops-learning"
version = "0.1.0"
description = "MLOps Engineering: Experiment Tracking, Pipelines, Serving APIs, Docker, and Drift Detection"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ai-journey-shared",
    "fastapi>=0.115.0",
    "mlflow>=2.20.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.34.0",
]

[tool.uv.sources]
ai-journey-shared = { path = "../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_learning"]

[dependency-groups]
dev = [
    "basedpyright>=1.27.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
