[project]
name = "nlp-learning"
version = "0.1.0"
description = "Natural Language Processing: Preprocessing, Word Embeddings, Sequence Models, and Attention"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ai-journey-shared",
    "gensim>=4.3.0",
    "jupyter>=1.1.0",
    "nltk>=3.9.0",
    "numpy>=2.2.0",
    "spacy>=3.8.0",
    "torch>=2.6.0",
]

[tool.uv.sources]
ai-journey-shared = { path = "../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nlp_learning"]

[dependency-groups]
dev = [
    "basedpyright>=1.27.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
